  <style type="text/css">@keyframes alertBubble {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  12% { transform: translateY(-2px) scale(1.02); opacity: 1; }
  32% { transform: translateY(-11px) scale(0.65); opacity: 0.9; }
  42% { transform: translateY(-14px) scale(0.2); opacity: 0; }
  88% { transform: translateY(2px) scale(0.3); opacity: 0; }
  95% { transform: translateY(0.5px) scale(0.85); opacity: 0.7; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes lowerArrowPulse {
  0%, 100% { opacity: 0.35; transform: translateY(0); }
  15%, 32% { opacity: 1; transform: translateY(-1.8px); }
  45% { opacity: 0.35; transform: translateY(0); }
  85% { opacity: 0.35; }
}
@keyframes aiHeadProcess {
  0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  28% { transform: scale(1) rotate(0deg); filter: brightness(1); }
  38% { transform: scale(1.08) rotate(-3deg); filter: brightness(1.2); }
  48% { transform: scale(1.12) rotate(3deg); filter: brightness(1.3); }
  58% { transform: scale(1.06) rotate(-2deg); filter: brightness(1.15); }
  68% { transform: scale(1) rotate(0deg); filter: brightness(1); }
}
@keyframes aiAuraPulse {
  0%, 25%, 85%, 100% { transform: scale(0.92); opacity: 0.15; }
  42% { transform: scale(1.22); opacity: 0.65; }
  54% { transform: scale(1.38); opacity: 0.3; }
  66% { transform: scale(1.05); opacity: 0.15; }
}
@keyframes upperArrowPulse {
  0%, 48%, 90%, 100% { opacity: 0.3; transform: translateY(0); }
  58%, 72% { opacity: 1; transform: translateY(-2px); }
  82% { opacity: 0.4; transform: translateY(0); }
}
@keyframes taskCardEmerge {
  0%, 46% { transform: translateY(14px) scale(0.3); opacity: 0; }
  54% { transform: translateY(10px) scale(0.6); opacity: 0.75; }
  68% { transform: translateY(0px) scale(1.04); opacity: 1; }
  78% { transform: translateY(-0.8px) scale(1); opacity: 1; }
  92% { transform: translateY(0px) scale(1); opacity: 1; }
  98% { transform: translateY(0px) scale(0.95); opacity: 0; }
  100% { transform: translateY(14px) scale(0.3); opacity: 0; }
}
@keyframes slotTelemetry {
  0% { stroke-dashoffset: 0; opacity: 0.75; }
  50% { stroke-dashoffset: 1; opacity: 1; }
  100% { stroke-dashoffset: 2; opacity: 0.75; }
}
.anim-alert-bubble {
  animation: alertBubble 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.anim-lower-arrow {
  animation: lowerArrowPulse 4s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.anim-ai-orb {
  animation: aiHeadProcess 4s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.anim-ai-aura {
  animation: aiAuraPulse 4s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.anim-upper-arrow {
  animation: upperArrowPulse 4s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.anim-task-card {
  animation: taskCardEmerge 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.anim-indicator-slot {
  animation: slotTelemetry 2s linear infinite;
}</style>
